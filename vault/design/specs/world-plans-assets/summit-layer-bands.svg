<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" role="img" aria-labelledby="t d">
  <title id="t">Summit Pass layer bands, cross-section from the road centre line outward</title>
  <desc id="d">Concept diagram of the proposed road-edge, near, mid and far bands. Not a render of the built map.</desc>
  <rect width="960" height="470" fill="#e9f1fa"/>
  <!-- sky -->
  <rect x="0" y="0" width="960" height="330" fill="#cfe4f7"/>
  <rect x="0" y="230" width="960" height="100" fill="#dcebf8"/>
  <!-- FAR band: massif and ridge curtains (lightest at the back) -->
  <polygon points="560,330 640,190 690,215 760,110 800,150 850,60 900,120 930,160 960,330" fill="#a9c1df"/>
  <polygon points="850,60 835,88 850,80 868,92" fill="#ffffff"/>
  <polygon points="760,110 748,132 760,126 774,136" fill="#ffffff"/>
  <polygon points="560,330 600,235 650,255 700,200 760,250 820,215 880,260 960,240 960,330" fill="#8fadd2"/>
  <!-- MID band: spurs and foothills -->
  <polygon points="330,330 380,250 430,282 480,225 540,270 570,330" fill="#7f9fc6"/>
  <polygon points="480,225 470,242 480,238 492,246" fill="#ffffff"/>
  <polygon points="330,330 350,290 400,300 440,330" fill="#6f8fb8"/>
  <!-- mid pine band -->
  <g fill="#2d6350">
    <polygon points="440,330 450,296 460,330"/><polygon points="455,330 466,290 477,330"/><polygon points="472,330 482,298 492,330"/>
    <polygon points="500,330 511,294 522,330"/><polygon points="518,330 528,300 538,330"/>
  </g>
  <!-- ground -->
  <rect x="0" y="330" width="960" height="140" fill="#eef4fa"/>
  <!-- NEAR band: chalets and groves -->
  <rect x="226" y="296" width="44" height="34" fill="#966242"/>
  <polygon points="220,296 248,262 276,296" fill="#a8433f"/>
  <polygon points="224,296 248,266 272,296 266,296 248,274 230,296" fill="#f4f8fc"/>
  <rect x="244" y="310" width="8" height="20" fill="#5e3f2e"/>
  <rect x="280" y="278" width="40" height="52" fill="#7b5a43"/>
  <polygon points="274,278 300,236 326,278" fill="#3f5b73"/>
  <polygon points="278,278 300,242 322,278 316,278 300,250 284,278" fill="#f4f8fc"/>
  <g fill="#2d6350">
    <polygon points="206,330 218,278 230,330"/><polygon points="296,330 310,262 324,330"/>
  </g>
  <!-- tower landmark (taller than neighbours) -->
  <rect x="338" y="236" width="20" height="94" fill="#8a6a54"/>
  <polygon points="334,236 348,196 362,236" fill="#3f5b73"/>
  <!-- ROAD-EDGE and road -->
  <rect x="60" y="330" width="114" height="22" fill="#4d5d78"/>
  <g stroke="#f4f8fc" stroke-width="3" stroke-dasharray="10 8"><line x1="98" y1="341" x2="98" y2="341"/></g>
  <rect x="64" y="338" width="16" height="3" fill="#f4f8fc"/><rect x="100" y="338" width="16" height="3" fill="#f4f8fc"/><rect x="136" y="338" width="16" height="3" fill="#f4f8fc"/>
  <rect x="174" y="330" width="36" height="22" fill="#ffffff"/>
  <rect x="190" y="304" width="3" height="26" fill="#4a5568"/>
  <rect x="190" y="304" width="12" height="3" fill="#4a5568"/>
  <!-- band separators and labels -->
  <g stroke="#1f2a3a" stroke-width="1" stroke-dasharray="4 4" opacity="0.55">
    <line x1="174" y1="40" x2="174" y2="470"/><line x1="210" y1="40" x2="210" y2="470"/>
    <line x1="330" y1="40" x2="330" y2="470"/><line x1="560" y1="40" x2="560" y2="470"/>
  </g>
  <g font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#1f2a3a">
    <text x="62" y="372">ROAD 0 to 38</text>
    <text x="62" y="388" font-size="11">(4 x 17 lanes + 2 x 4 shoulders, fixed contract)</text>
    <text x="176" y="372" font-size="11">EDGE</text>
    <text x="176" y="386" font-size="11">38-50</text>
    <text x="226" y="372">NEAR 50 to 90</text>
    <text x="226" y="388" font-size="11">chalets, groves, rock, lake shore</text>
    <text x="344" y="372">MID 100 to 220</text>
    <text x="344" y="388" font-size="11">spurs, terraces, treeline, lift line</text>
    <text x="574" y="372">FAR 300 to 1,000+</text>
    <text x="574" y="388" font-size="11">massifs, ridge curtains, haze steps</text>
    <text x="62" y="30" font-size="15" font-weight="600">Summit Pass, proposed layer bands (lateral studs from the centre line)</text>
    <text x="62" y="48" font-size="12">Each band steps lighter and bluer with distance; the road stays the darkest large shape.</text>
    <text x="62" y="428" font-size="11">Scale is compressed beyond 90 studs and heights are not to scale between bands. Band limits follow Sequencer.luau and README.md.</text>
    <text x="62" y="448" font-size="13" font-weight="600" fill="#a8433f">Concept diagram, not a render of the built map.</text>
  </g>
</svg>
