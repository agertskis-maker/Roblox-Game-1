name: Project checks

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, format, and Rojo build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      # Installs Rokit, then runs `rokit install` against rokit.toml (see the action's
      # action.yml), so no separate install step is needed. The action is pinned to the
      # v0.2.1 commit; `version` pins Rokit itself.
      - uses: CompeyDev/setup-rokit@1d9390883f7ebce19d48f5b8d006e11d387c92ab # v0.2.1
        with:
          version: v1.2.0
      - name: Install Wally packages
        run: wally install
      - name: Check first-party source and build
        shell: pwsh
        run: ./scripts/check.ps1
