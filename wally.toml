[package]
name = "team/roblox-game-1"
version = "0.1.0"
registry = "https://github.com/UpliftGames/wally-index"
realm = "shared"
private = true

# Shared realm: installed to Packages/ -> ReplicatedStorage.Packages (client + server)
[dependencies]
Trove = "sleitnick/trove@1.8.0"
Signal = "sleitnick/signal@2.0.3"
Promise = "evaera/promise@4.0.0"

# Server realm: installed to ServerPackages/ -> ServerScriptService.ServerPackages (never replicated)
# Empty for now. ProfileStore is vendored in src/server/vendor/, not installed by Wally.
# See vault/decisions/0001-profilestore-source.md
[server-dependencies]
